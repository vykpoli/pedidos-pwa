<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
    }
    header {
      background-color: #007bff;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 1.5em;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
      background-color: #fff;
      border-bottom: 1px solid #ccc;
    }
    nav button {
      flex: 1;
      padding: 15px;
      background-color: #f8f9fa;
      border: none;
      font-size: 1em;
      border-right: 1px solid #ccc;
    }
    nav button.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }
    .section {
      display: none;
      padding: 20px;
    }
    .section.active {
      display: block;
    }
    button, select, input, textarea {
      font-size: 1.1em;
      padding: 12px;
      margin: 5px 0;
      width: 100%;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }
    textarea {
      height: 150px;
    }
    h2 {
      margin-top: 0;
    }
    .flex-row {
      display: flex;
      gap: 10px;
    }
    .flex-row button {
      flex: 1;
    }
    .product-entry {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 5px 0;
    }
    .danger { background-color: #dc3545; color: white; }
    .success { background-color: #28a745; color: white; }
    .info { background-color: #17a2b8; color: white; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header>Pedidos</header>
  <nav>
    <button onclick="showTab('makeOrder')" class="active">Hacer pedido</button>
    <button onclick="showTab('viewOrder')">Ver pedido</button>
    <button onclick="showTab('addDistributor')">Distribuidores</button>
    <button onclick="showTab('addProducts')">Productos</button>
  </nav>

  <div id="makeOrder" class="section active">
    <h2>Seleccionar distribuidor</h2>
    <select id="selectDistributor" onchange="startProductSelection()"></select>
    <div id="productSelection" class="hidden">
      <h2>Selecciona productos</h2>
      <div id="productList"></div>
      <button id="generateListBtn" class="info hidden" onclick="generateOrderList()">Generar lista</button>
    </div>
  </div>

  <div id="viewOrder" class="section">
    <h2>Ver pedido</h2>
    <textarea id="orderText"></textarea>
    <div class="flex-row">
      <button class="info" onclick="copyOrder()">Copiar</button>
      <button class="success" onclick="saveOrder()">Guardar</button>
      <button class="info" onclick="loadOrder()">Cargar</button>
    </div>
  </div>

  <div id="addDistributor" class="section">
    <h2>Distribuidores</h2>
    <input type="text" id="newDistributor" placeholder="Nuevo distribuidor">
    <button class="success" onclick="addDistributor()">Añadir</button>
    <div id="distributorList"></div>
  </div>

  <div id="addProducts" class="section">
    <h2>Seleccionar distribuidor</h2>
    <select id="selectDistForProduct" onchange="showProductManager()"></select>
    <div id="productManager" class="hidden">
      <h2>Productos</h2>
      <div id="productMgmtList"></div>
      <input type="text" id="newProduct" placeholder="Nuevo producto">
      <button class="success" onclick="addProduct()">Añadir producto</button>
    </div>
  </div>

  <script>
    let distribuidores = JSON.parse(localStorage.getItem('distribuidores') || '{}');
    let pedido = {};

    function showTab(id) {
      document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.querySelector(`nav button[onclick*="${id}"]`).classList.add('active');
      document.getElementById(id).classList.add('active');
      if (id === 'addDistributor') updateDistributorList();
      if (id === 'addProducts') fillDistributorSelect('selectDistForProduct');
      if (id === 'makeOrder') fillDistributorSelect('selectDistributor');
    }

    function updateDistributorList() {
      const container = document.getElementById('distributorList');
      container.innerHTML = '';
      for (const dist in distribuidores) {
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = `❌ ${dist}`;
        btn.onclick = () => { delete distribuidores[dist]; save(); updateDistributorList(); };
        container.appendChild(btn);
      }
    }

    function addDistributor() {
      const name = document.getElementById('newDistributor').value.trim();
      if (name && !distribuidores[name]) {
        distribuidores[name] = [];
        save();
        document.getElementById('newDistributor').value = '';
        updateDistributorList();
      }
    }

    function fillDistributorSelect(id) {
      const select = document.getElementById(id);
      select.innerHTML = '<option value="">-- Selecciona --</option>';
      for (const d in distribuidores) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        select.appendChild(opt);
      }
    }

    function showProductManager() {
      const dist = document.getElementById('selectDistForProduct').value;
      const manager = document.getElementById('productManager');
      const list = document.getElementById('productMgmtList');
      manager.classList.toggle('hidden', !dist);
      if (!dist) return;
      list.innerHTML = '';
      for (const p of distribuidores[dist]) {
        const btn = document.createElement('button');
        btn.className = 'danger';
        btn.textContent = `❌ ${p}`;
        btn.onclick = () => {
          distribuidores[dist] = distribuidores[dist].filter(x => x !== p);
          save();
          showProductManager();
        };
        list.appendChild(btn);
      }
    }

    function addProduct() {
      const dist = document.getElementById('selectDistForProduct').value;
      const name = document.getElementById('newProduct').value.trim();
      if (dist && name) {
        distribuidores[dist].push(name);
        save();
        document.getElementById('newProduct').value = '';
        showProductManager();
      }
    }

    function startProductSelection() {
      const dist = document.getElementById('selectDistributor').value;
      const section = document.getElementById('productSelection');
      const list = document.getElementById('productList');
      const btn = document.getElementById('generateListBtn');
      if (!dist) return section.classList.add('hidden');
      section.classList.remove('hidden');
      list.innerHTML = '';
      btn.classList.add('hidden');
      distribuidores[dist].forEach(prod => {
        const div = document.createElement('div');
        div.className = 'product-entry';
        div.innerHTML = `<input type="checkbox" onchange="toggleGenerateBtn()" value="${prod}" style="margin-right:10px;">
                         <span style="flex:1">${prod}</span>
                         <input type="number" min="1" style="width:70px">`;
        list.appendChild(div);
      });
    }

    function toggleGenerateBtn() {
      const anyChecked = [...document.querySelectorAll('#productList input[type=checkbox]')].some(x => x.checked);
      document.getElementById('generateListBtn').classList.toggle('hidden', !anyChecked);
    }

    function generateOrderList() {
      pedido = {};
      [...document.querySelectorAll('#productList .product-entry')].forEach(entry => {
        const checkbox = entry.querySelector('input[type=checkbox]');
        const quantity = entry.querySelector('input[type=number]').value;
        if (checkbox.checked && quantity > 0) {
          pedido[checkbox.value] = quantity;
        }
      });
      showTab('viewOrder');
      const text = Object.entries(pedido).map(([prod, qty]) => `- ${prod}: ${qty}`).join('\n');
      document.getElementById('orderText').value = text;
    }

    function copyOrder() {
      navigator.clipboard.writeText(document.getElementById('orderText').value);
      alert('Pedido copiado');
    }

    function saveOrder() {
      const text = document.getElementById('orderText').value;
      const blob = new Blob([text], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'pedido.txt';
      link.click();
    }

    function loadOrder() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.txt';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById('orderText').value = reader.result;
        };
        reader.readAsText(file);
      };
      input.click();
    }

    function save() {
      localStorage.setItem('distribuidores', JSON.stringify(distribuidores));
    }

    document.getElementById('newDistributor').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addDistributor();
      }
    });

    document.getElementById('newProduct').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addProduct();
      }
    });
  </script>
</body>
</html>
