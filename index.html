<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pedidos</title>
  <!-- Contenido HTML omitido por longitud -->
  <!-- Aquí iría todo tu código HTML actualizado del canvas -->
  <script>
    // Función para guardar el pedido en un archivo .txt
    function saveOrder() {
      const text = document.getElementById('orderText').value;
      const blob = new Blob([text], { type: 'text/plain' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'pedido.txt';
      link.click();
    }

    // Función para cargar el pedido desde un archivo .txt
    function loadOrder() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.txt';
      input.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          document.getElementById('orderText').value = reader.result;
        };
        reader.readAsText(file);
      };
      input.click();
    }
  </script>
</body>
</html>
